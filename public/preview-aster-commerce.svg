<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Aster Supply commerce concept preview</title>
  <desc id="desc">A fictional premium workspace goods catalogue and order summary interface.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2efe8"/><stop offset="1" stop-color="#dcd6c8"/></linearGradient>
    <linearGradient id="product" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4d9a4"/><stop offset="1" stop-color="#bf6f3f"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-opacity=".14"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="#151713"/>

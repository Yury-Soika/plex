<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Back shortly · Plex</title>
<meta name="robots" content="noindex, nofollow">
<!--
  Retry automatically every 60s so a visitor who leaves the tab open lands back
  on the real site as soon as it returns, without having to think about it.
-->
<meta http-equiv="refresh" content="60">
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --bg: #0a0a0f;
    --fg: #f4f4ff;
    --muted: #a0a0b8;
    --accent: #c084fc;
    --accent-strong: #a855f7;
    --hairline: rgba(244, 244, 255, 0.12);
  }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    /* A soft purple bloom, drawn with a gradient so this file stays dependency-free. */
    background-image:
      radial-gradient(60rem 40rem at 50% -10%, rgba(168, 85, 247, 0.18), transparent 70%),
      radial-gradient(40rem 30rem at 100% 100%, rgba(192, 132, 252, 0.08), transparent 70%);
    background-repeat: no-repeat;
  }

  main { width: 100%; max-width: 46rem; }

  .eyebrow {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin: 0;
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
  }

  /* Slow pulse — signals "working on it" without demanding attention. */
  .dot {
    width: 0.5rem;
    height: 0.5rem;
    border-radius: 50%;
    background: var(--accent-strong);
    flex: none;
    animation: pulse 2.4s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.35; transform: scale(0.8); }
  }

  h1 {
    margin: 1.25rem 0 0;
    font-size: clamp(2rem, 6vw, 3.75rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
    font-weight: 700;
  }

  .lede {
    margin: 1.25rem 0 0;
    color: var(--muted);
    font-size: clamp(1rem, 2.4vw, 1.15rem);
    line-height: 1.65;
    max-width: 36rem;
  }

  .meta {
    margin: 2.5rem 0 0;
    padding-top: 1.5rem;
    border-top: 1px solid var(--hairline);
    color: var(--muted);
    font-size: 0.9rem;
    line-height: 1.6;
  }

  .meta strong { color: var(--fg); font-weight: 600; }

  .retry {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    margin-top: 1.75rem;
    padding: 0.85rem 1.5rem;
    border: 1px solid var(--hairline);
    border-radius: 999px;
    background: transparent;
    color: var(--fg);
    font: inherit;
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    text-decoration: none;
    cursor: pointer;
    transition: background-color 0.2s ease, border-color 0.2s ease;
  }

  .retry:hover, .retry:focus-visible {
    background: rgba(168, 85, 247, 0.14);
    border-color: var(--accent-strong);
  }

  /* Respect users who don't want motion. */
  @media (prefers-reduced-motion: reduce) {
    .dot { animation: none; }
    .retry { transition: none; }
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow"><span class="dot" aria-hidden="true"></span>Plex · Maintenance</p>

    <h1>We&rsquo;ll be back shortly.</h1>

    <p class="lede">
      Temporarily down for maintenance. This page refreshes on its own.
    </p>

    <a class="retry" href="/">Retry now</a>

    <!--
      Deliberately no contact address here: contact@plex.ee is on the same provider,
      so during an outage it is usually down too — and an unanswered address reads
      worse than none. If you want a contact route, add a channel hosted ELSEWHERE
      (phone, WhatsApp, Gmail) as a <p class="meta"> below.
    -->
  </main>
</body>
</html>
